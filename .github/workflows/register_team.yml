name: Auto Register Team via GitHub Issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  register:
    if: contains(github.event.issue.labels.*.name, 'registration') || contains(github.event.issue.title, '[REGISTRATION]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Process Team Registration
        uses: actions/github-script@v7
        env:
          GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
        with:
          script: |
            const script = require('./.github/scripts/process_registration.js');
            await script({ github, context });

      - name: Commit and push changes
        run: |
          git config --global user.name 'CTFarsi Bot'
          git config --global user.email 'bot@ctfarsi.github.io'
          git add data/teams.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-register team via verified GitHub issue [skip ci]" && git push)
