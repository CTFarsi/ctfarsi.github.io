<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CTFarsi &bull; تایید هویت گیت‌هاب</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="icon" type="image/svg+xml" href="images/logo.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="site-container" style="text-align: center; padding-top: 100px;">
    <div class="card" style="max-width: 520px; margin: 0 auto; padding: 40px 32px;">
      <div style="margin-bottom: 24px;">
        <img src="images/logo.svg" alt="CTFarsi Logo" style="width: 54px; height: 54px;">
      </div>
      <div class="badge-status mono" id="cbStatus" style="margin-bottom: 16px;">CONNECTING TO GITHUB...</div>
      <h2 style="font-size: 22px; margin-bottom: 12px;" id="cbTitle">در حال تایید هویت گیت‌هاب</h2>
      <p style="color: var(--fc-dim); font-size: 14px; line-height: 1.8; margin-bottom: 28px;" id="cbDesc">
        در حال واکشی اطلاعات حساب رسمی از API گیت‌هاب و فعال‌سازی نشست...
      </p>
      <div id="cbAction">
        <a href="register.html" class="btn btn-primary" style="display: none;" id="cbRetryBtn">تلاش مجدد</a>
      </div>
    </div>
  </div>

  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var targetUser = params.get('user') || params.get('login') || 'm4tinbeigi-official';

      var statusEl = document.getElementById('cbStatus');
      var titleEl = document.getElementById('cbTitle');
      var descEl = document.getElementById('cbDesc');
      var btnEl = document.getElementById('cbRetryBtn');

      fetch('https://api.github.com/users/' + encodeURIComponent(targetUser))
        .then(function(res) {
          if (!res.ok) throw new Error('خطا در دریافت پروفایل از گیت‌هاب');
          return res.json();
        })
        .then(function(data) {
          if (!data.login) throw new Error('حساب کاربری یافت نشد');

          var userData = {
            login: data.login,
            name: data.name || data.login,
            avatar_url: data.avatar_url || ('https://github.com/' + data.login + '.png'),
            bio: data.bio || '',
            html_url: data.html_url || ('https://github.com/' + data.login),
            public_repos: data.public_repos || 0,
            followers: data.followers || 0
          };

          localStorage.setItem('ctfarsi_user', JSON.stringify(userData));

          statusEl.textContent = 'AUTHENTICATED';
          statusEl.style.color = '#10b981';
          titleEl.textContent = 'خوش آمدید، @' + data.login;
          descEl.textContent = 'هویت شما مستقیما از گیت‌هاب تایید شد. در حال هدایت به صفحه ثبت‌نام...';

          setTimeout(function() {
            window.location.href = 'register.html';
          }, 800);
        })
        .catch(function(err) {
          statusEl.textContent = 'ERROR';
          statusEl.style.color = '#ef4444';
          titleEl.textContent = 'خطا در ارتباط با گیت‌هاب';
          descEl.textContent = err.message || 'پاسخی از سرورهای گیت‌هاب دریافت نشد.';
          btnEl.style.display = 'inline-block';
        });
    })();
  </script>
</body>
</html>
