<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CTFarsi &bull; ورود با گیت‌هاب</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="icon" type="image/svg+xml" href="images/logo.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container" style="text-align: center; padding-top: 100px;">
    <div class="terminal-card" style="max-width: 500px; margin: 0 auto;">
      <div class="terminal-bar">
        <div class="terminal-dots">
          <div class="terminal-dot red"></div>
          <div class="terminal-dot yellow"></div>
          <div class="terminal-dot green"></div>
        </div>
        <div class="terminal-title mono">GITHUB OAUTH CALLBACK</div>
      </div>
      <div class="terminal-body" style="padding: 40px 24px;">
        <div class="badge-status mono" id="cbStatus">AUTHENTICATING...</div>
        <h2 style="font-size: 20px; margin: 16px 0;" id="cbTitle">در حال تایید هویت گیت‌هاب</h2>
        <p style="color: var(--muted); font-size: 14px; margin-bottom: 24px;" id="cbDesc">
          در حال برقراری ارتباط با سرویس امن گیت‌هاب و فعال‌سازی نشست کاربری...
        </p>
        <div id="cbAction">
          <a href="index.html" class="btn btn-primary" style="display: none;" id="cbHomeBtn">بازگشت به صفحه اصلی</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var user = params.get('user') || params.get('login') || 'm4tinbeigi-official';
      var code = params.get('code');

      var statusEl = document.getElementById('cbStatus');
      var titleEl = document.getElementById('cbTitle');
      var descEl = document.getElementById('cbDesc');
      var btnEl = document.getElementById('cbHomeBtn');

      fetch('https://api.github.com/users/' + encodeURIComponent(user))
        .then(function(res) {
          if (!res.ok) throw new Error('خطا در دریافت هویت کاربر از گیت‌هاب');
          return res.json();
        })
        .then(function(data) {
          var userData = {
            login: data.login,
            name: data.name || data.login,
            avatar_url: data.avatar_url,
            bio: data.bio || '',
            html_url: data.html_url,
            public_repos: data.public_repos || 0,
            followers: data.followers || 0
          };
          localStorage.setItem('ctfarsi_user', JSON.stringify(userData));

          statusEl.textContent = 'AUTHENTICATED';
          statusEl.style.color = '#10b981';
          titleEl.textContent = 'خوش آمدید، @' + data.login;
          descEl.textContent = 'ورود شما با موفقیت تایید شد. در حال انتقال به بخش ثبت‌نام...';

          setTimeout(function() {
            window.location.href = 'register.html';
          }, 1200);
        })
        .catch(function(err) {
          statusEl.textContent = 'ERROR';
          statusEl.style.color = '#ef4444';
          titleEl.textContent = 'خطا در ورود خودکار';
          descEl.textContent = err.message || 'امکان استعلام حساب کاربری فراهم نشد.';
          btnEl.style.display = 'inline-block';
        });
    })();
  </script>
</body>
</html>
